[package]
name = "crud_livros_web"
version = "0.1.0"
edition = "2021"

# ══════════════════════════════════════════════════════════════
# Stack inspirada em empresas que usam Rust em produção:
#
# • Discord  → Usa Tokio + Axum para serviços de leitura/escrita
# • Cloudflare → Rust para Workers e edge computing
# • Figma    → Rust no backend de renderização multiplayer
#
# Axum: Framework web criado pelo time do Tokio (mesmo da Discord)
# Serde: Serialização/Deserialização JSON (padrão da indústria Rust)
# Tokio: Runtime assíncrono (o "motor" por baixo de tudo)
# Tower-HTTP: Middlewares (CORS, servir arquivos estáticos)
# ══════════════════════════════════════════════════════════════

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
